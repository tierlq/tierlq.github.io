# Tự cập nhật số liệu ĐTDV (Đấu Trường Danh Vọng) từ API Liquipedia, mỗi sáng 6:17 giờ Việt Nam.
# Không có số mới → dừng, không đổi gì. Có số mới → ghi data.js, sinh lại trang, chạy kiểm tra (như tools/check/all.sh), đạt mới đẩy lên main.
# Lỗi (API hỏng, số lệch, tên tướng lạ, kiểm tra không đạt) → tác vụ báo đỏ, GitHub gửi email, web giữ nguyên số cũ.
# Chạy tay: tab Actions → "Tự cập nhật ĐTDV" → Run workflow. Xem CLAUDE.md, mục SRC.aog.
name: Tự cập nhật ĐTDV
on:
  schedule:
    - cron: '17 23 * * *'   # 23:17 UTC = 6:17 sáng giờ Việt Nam
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/aog.yml', 'tools/aog/**']   # sửa chính tác vụ này thì chạy thử luôn
permissions:
  contents: write
concurrency:
  group: aog-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Đọc Liquipedia (1 lần gọi API) và so với số trên web
        id: aog
        run: node tools/aog/update.js
      - name: Sinh lại trang
        if: steps.aog.outputs.changed == 'true'
        run: |
          node tools/seo/build.js | tail -1
          node tools/builds/check.js | tail -1
      - name: Kiểm tra cú pháp, link, dữ liệu
        if: steps.aog.outputs.changed == 'true'
        run: |
          for f in assets/*.js; do node --check "$f"; done
          node tools/check/links.js
          node tools/check/data.js
      - name: Kiểm tra trên trình duyệt (Playwright, mở mọi bảng chi tiết)
        if: steps.aog.outputs.changed == 'true'
        run: |
          npm i -g playwright@1 >/dev/null
          playwright install --with-deps chromium >/dev/null
          NODE_PATH=$(npm root -g) node tools/check/smoke.js
      - name: Đẩy lên main
        if: steps.aog.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898579+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q tools/aog/.msg 2>/dev/null || true
          git commit -q -F tools/aog/.msg
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          git log --oneline -1
